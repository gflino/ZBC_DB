<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombicide Compendium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menu Lateral Oculto -->
    <div id="overlay" class="overlay hidden" onclick="toggleMenu()"></div>
    <nav id="sidebar" class="sidebar">
        <button class="close-btn" onclick="toggleMenu()">×</button>
        <a href="#" onclick="mudarTela('home-view')" data-i18n="menuHome">🏠 Início</a>
        <a href="#" onclick="mudarTela('skills-view')" data-i18n="menuSkills">📖 Habilidades</a>
        <a href="#" onclick="mudarTela('characters-view')" data-i18n="menuSurvivors">🧟‍♂️ Sobreviventes</a>
    </nav>

    <!-- Cabeçalho Principal -->
    <header>
        <button id="menu-btn" onclick="toggleMenu()">☰</button>
        <h1 id="site-title" onclick="mudarTela('home-view')" data-i18n="title">Zombicide Compêndio</h1>
        <button id="btn-language" onclick="toggleIdioma()">EN / PT</button>
    </header>

    <!-- TELA 1: Menu Inicial -->
    <main id="home-view" class="view-section">
        <h2 data-i18n="homeQuestion" class="text-center">O que você deseja buscar?</h2>
        <div class="menu-botoes">
            <button class="btn-acao" onclick="mudarTela('skills-view')" data-i18n="btnSearchSkills">📖 Buscar Habilidades</button>
            <button class="btn-acao" onclick="mudarTela('characters-view')" data-i18n="btnSearchSurvivors">🧟‍♂️ Buscar Sobreviventes</button>
        </div>
    </main>

    <!-- TELA 2: Busca de Habilidades -->
    <main id="skills-view" class="view-section hidden">
        <h2 data-i18n="titleSkills">Busca de Habilidades</h2>
        <div class="search-controls-mobile">
            <!-- Container Relativo para o Dropdown flutuante -->
            <div class="input-container">
                <input type="text" id="search-skills" data-i18n="placeholderSkills" placeholder="Digite o nome da habilidade..." autocomplete="off">
                <div id="skills-dropdown" class="autocomplete-dropdown hidden"></div>
            </div>
            <button onclick="listarTodasHabilidades()" class="btn-acao" data-i18n="btnAllSkills">📖 Ver Todas as Habilidades</button>
        </div>
        <!-- Onde a habilidade selecionada ou a lista completa vai aparecer -->
        <div id="skills-results-foco" class="lista-resultados"></div>
    </main>

    <!-- TELA 3: Busca de Personagens -->
    <main id="characters-view" class="view-section hidden">
        <h2 data-i18n="titleSurvivors">Busca de Sobreviventes</h2>
        <div class="character-controls">
            <!-- Container Relativo para o Dropdown flutuante -->
            <div class="input-container">
                <input type="text" id="search-characters" data-i18n="placeholderSurvivors" placeholder="Digite o nome do personagem..." autocomplete="off">
                <div id="characters-dropdown" class="autocomplete-dropdown hidden"></div>
            </div>
            <button onclick="sortearPersonagem()" class="btn-acao" data-i18n="btnRandom">🎲 Sobrevivente Aleatório</button>
            <button onclick="listarPorCaixas()" class="btn-acao" data-i18n="btnListBoxes">📦 Ver Lista Completa</button>
        </div>
        <!-- Onde a ficha do personagem selecionado vai aparecer -->
        <div id="characters-results-foco"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
