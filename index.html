<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombicide Skill List</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e22;
      --dropdown-bg: #26262b;
      --text-main: #f5f5f7;
      --text-muted: #a0a0a8;
      --accent: #e63946;
      --border: #2f2f35;
      --hover-bg: #32323a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 1rem;
      max-width: 680px;
      margin: 0 auto;
    }

    /* --- CABEÇALHO --- */
    header {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0.5rem 0 1rem 0;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      text-align: center;
    }

    .top-right-controls {
      position: absolute;
      right: 0;
      display: flex;
      gap: 0.4rem;
    }

    .btn-action {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-action:hover, .btn-action.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* --- BARRA DE PESQUISA (FIXA NO TOPO) --- */
    .search-container {
      position: sticky;
      top: 10px;
      z-index: 100;
      margin-bottom: 1.5rem;
    }

    .search-input-wrapper {
      position: relative;
    }

    #search-input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    #search-input:focus {
      border-color: var(--accent);
    }

    /* --- LISTA SUSPENSA DE SUGESTÕES (DROPDOWN) --- */
    #suggestions-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: var(--dropdown-bg);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 260px;
      overflow-y: auto;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      display: none; /* Escondida por padrão */
      z-index: 101;
    }

    .suggestion-item {
      padding: 0.8rem 1.2rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background-color 0.15s;
      font-size: 0.95rem;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--hover-bg);
      color: var(--accent);
    }

    /* --- ÁREA DE EXIBIÇÃO DE REGRAS --- */
    .results-area {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .skill-card {
      background-color: var(--card-bg);
      border-left: 4px solid var(--accent);
      padding: 1.2rem;
      border-radius: 6px;
      animation: fadeIn 0.2s ease-in;
    }

    .skill-title {
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .skill-desc {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Zombicide Skill List</h1>
    <div class="top-right-controls">
      <button id="btn-show-all" class="btn-action">Ver Todas</button>
      <button id="btn-lang" class="btn-action" data-lang="pt">PT</button>
    </div>
  </header>

  <div class="search-container">
    <div class="search-input-wrapper">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Digite para buscar uma habilidade..."
        autocomplete="off"
      >
      <!-- Lista suspensa que aparece ao digitar -->
      <div id="suggestions-dropdown"></div>
    </div>
  </div>

  <!-- Cards com o texto completo aparecem aqui quando clicados -->
  <main id="results" class="results-area"></main>

  <script src="script.js"></script>
</body>
</html>
